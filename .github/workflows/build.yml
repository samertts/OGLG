# GitHub Actions CI/CD workflow for the Correspondence System.
#
# Builds the Windows executable and creates both portable ZIP
# and installer artifacts for GitHub Releases.
#
# This workflow runs on:
#   - Push to main branch (validation only)
#   - Tag push v*.*.* (full release build)
#   - Manual trigger via workflow_dispatch

name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string override (e.g. 1.0.0)"
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.12"
  PROJECT_NAME: "OfflineCorrespondenceSystem"

jobs:
  validate:
    name: Code Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: [validate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref }}" -match "^refs/tags/v(.*)$") {
            $ver = $Matches[1]
          } else {
            $ver = "0.0.0-dev"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Building version: $ver"

      - name: Build PyInstaller executable
        run: |
          python -m PyInstaller build/oglg.spec --workpath build/pyinstaller_build --distpath build/pyinstaller_dist --clean

      - name: Validate build artifacts
        run: |
          python build/validate_build.py --build-dir build/pyinstaller_dist/OfflineCorrespondenceSystem

      - name: Create portable ZIP distribution
        run: |
          python build/build_portable.py --version ${{ steps.version.outputs.VERSION }} --skip-pyinstaller --output-dir dist

      - name: Validate portable ZIP
        run: |
          python build/validate_build.py --zip dist/OfflineCorrespondenceSystem_Portable_${{ steps.version.outputs.VERSION }}.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ steps.version.outputs.VERSION }}
          path: |
            dist/OfflineCorrespondenceSystem_Portable_*.zip
            dist/OfflineCorrespondenceSystem_Portable_*.sha256.txt
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          ver="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$ver" >> $GITHUB_OUTPUT

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build-${{ steps.version.outputs.VERSION }}
          path: release-artifacts

      - name: Generate release body
        id: release_body
        shell: bash
        run: |
          cat > release_body.md << 'EOF'
          ## ${{ steps.version.outputs.VERSION }}

          ### Downloads
          - **Portable ZIP** — extract and run, no installation required
          - **Windows Installer** — (requires Inno Setup; generated separately)

          ### Checksums
          EOF
          for f in release-artifacts/*.sha256.txt; do
            echo "- $(cat $f)" >> release_body.md
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body_path: release_body.md
          files: release-artifacts/*
          draft: true
          prerelease: false
          generate_release_notes: true
