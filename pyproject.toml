[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "oglg"
version = "1.0.0"
description = "Iraqi Government Offline Official Correspondence System"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "loguru>=0.7,<1.0",
]

[project.scripts]
oglg = "app.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
per-file-ignores = {"app/ui/dialogs/*" = ["F401"], "app/ui/shell/*" = ["F401"], "app/ui/widgets/*" = ["F401", "E501"], "app/ui/theme/*" = ["F401", "E501", "I001"], "tests/unit/ui/*" = ["F401"], "app/application/letters/*" = ["E501"], "app/infrastructure/letters/*" = ["E501"], "app/domain/letters/*" = ["E501"], "tests/unit/letters/*" = ["E501", "I001"]}

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
